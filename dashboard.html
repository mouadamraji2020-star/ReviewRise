<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewRise Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #697386;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .stat-card h2 {
      margin: 0;
      font-size: 28px;
    }

    .stat-card p {
      margin: 8px 0 0;
      color: #697386;
    }

    .feedback-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .rating {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .feedback-text {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .details {
      font-size: 13px;
      color: #697386;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ReviewRise Dashboard</h1>

    <p class="subtitle">
      Customer feedback overview
    </p>

    <div class="stats">

      <div class="stat-card">
        <h2 id="totalFeedback">0</h2>
        <p>Total Feedback</p>
      </div>

      <div class="stat-card">
        <h2 id="averageRating">0</h2>
        <p>Average Rating</p>
      </div>

      <div class="stat-card">
        <h2 id="lowRatings">0</h2>
        <p>1–3 Star Feedback</p>
      </div>

    </div>

    <div id="feedbackList">
      Loading feedback...
    </div>

  </div>

  <script>

    const SUPABASE_URL = "https://intlhwmvldxdiytemjlr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

    async function loadFeedback() {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/Feedback?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY
          }
        }
      );

      const data = await response.json();

      const feedbackList = document.getElementById("feedbackList");

      if (!response.ok) {
        feedbackList.innerHTML = "Could not load feedback.";
        return;
      }

      document.getElementById("totalFeedback").textContent =
        data.length;

      let totalRating = 0;
      let lowRatings = 0;

      data.forEach(function(item) {
        totalRating += item.rating;

        if (item.rating <= 3) {
          lowRatings++;
        }
      });

      const average =
        data.length > 0
          ? (totalRating / data.length).toFixed(1)
          : 0;

      document.getElementById("averageRating").textContent =
        average;

      document.getElementById("lowRatings").textContent =
        lowRatings;

      feedbackList.innerHTML = "";

      data.forEach(function(item) {

        const card = document.createElement("div");
        card.className = "feedback-card";

        const stars =
          "★".repeat(item.rating) +
          "☆".repeat(5 - item.rating);

        card.innerHTML = `
          <div class="rating">${stars}</div>

          <div class="feedback-text">
            ${item.feedback}
          </div>

          <div class="details">
            ${item.business}
            <br>
            ${new Date(item.created_at).toLocaleString()}
          </div>
        `;

        feedbackList.appendChild(card);

      });

    }

    loadFeedback();

  </script>

</body>
</html>
