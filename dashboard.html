<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewRise Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f7fb;
  color: #172033;
}

/* LOGIN */

#loginSection {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-card {
  width: 420px;
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.login-card h1 {
  margin-top: 0;
}

.login-card input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

.login-card button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  background: #111827;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* DASHBOARD */

#dashboard {
  display: none;
}

.sidebar {
  width: 240px;
  height: 100vh;
  background: #111827;
  color: white;
  position: fixed;
  left: 0;
  top: 0;
  padding: 28px 20px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 40px;
}

.menu-item {
  padding: 13px 15px;
  margin-bottom: 8px;
  border-radius: 9px;
  cursor: pointer;
  color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
  background: #1f2937;
  color: white;
}

.main {
  margin-left: 240px;
  padding: 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
}

.logout {
  background: #111827;
  color: white;
  border: none;
  padding: 11px 18px;
  border-radius: 8px;
  cursor: pointer;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
  margin-top: 35px;
}

.stat-card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.04);
}

.stat-card h2 {
  font-size: 30px;
  margin: 0 0 8px;
}

.stat-card p {
  margin: 0;
  color: #777;
}

.section-title {
  margin-top: 40px;
}

.feedback-card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  margin-top: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.04);
}

.stars {
  font-size: 20px;
  margin-bottom: 10px;
}

.feedback-text {
  font-size: 15px;
  margin-bottom: 10px;
}

.feedback-meta {
  color: #888;
  font-size: 13px;
}
  
a.menu-item {
    color: white;
    text-decoration: none !important;
    display: block;
}

a.menu-item:visited {
    color: white;
    text-decoration: none;
}
  
 .close-menu-btn {
    display: none;
} 
  
@media (max-width: 800px) {
  
  .close-menu-btn {
    display: block;
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}
  
.mobile-menu-btn {
    display: none;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1100;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 26px;
    cursor: pointer;
}
  
    .sidebar {
        display: none;
    }

  .sidebar.open {
    display: block;
    width: 240px;
    z-index: 1000;
}
  
    .main {
        margin-left: 0;
        padding: 140px 20px 20px;
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

/* ReviewRise top navigation */
.top-navbar {
    width: 100%;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-sizing: border-box;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: relative;
    z-index: 900;
}

.top-navbar-logo {
    font-size: 27px;
    font-weight: 700;
    color: #111827;
    margin-left: 18px;
}

.top-navbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
}

.navbar-icon {
    background: transparent;
    border: none;
    color: #111827;
    font-size: 28px;
    cursor: pointer;
}

/* Put the existing hamburger inside the navbar */
.top-navbar .mobile-menu-btn {
    position: static;
    display: block;
    background: transparent;
    color: #111827;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}
  
</style>
</head>

<body>

<button id="menuButton" class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
  
<div id="loginSection">

  <div class="login-card">

    <h1>ReviewRise</h1>
    <p>Sign in to your dashboard</p>

    <input id="email" type="email" placeholder="Email address">

    <input id="password" type="password" placeholder="Password">

    <button id="loginButton">Sign In</button>

    <p id="loginMessage"></p>

  </div>

</div>


<div id="dashboard">
  
<div class="top-navbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>

    <div class="top-navbar-logo">ReviewRise</div>

    <div class="top-navbar-actions">
        <button class="navbar-icon" aria-label="Account">
            ♙
        </button>
    </div>
</div>
  
  <aside class="sidebar">
    
    <button class="close-menu-btn" onclick="toggleSidebar()">×</button>
    
    <div class="logo">ReviewRise</div>

    <div class="menu-item active">
      Dashboard
    </div>

<a href="feedback.html" class="menu-item">Feedback</a>

<a href="analytics.html" class="menu-item">Analytics</a>

<a href="review-link.html" class="menu-item">Review Links</a>
    
    <div class="menu-item">
      QR & NFC
    </div>

    <div class="menu-item">
      Settings
    </div>

  </aside>


  <main class="main">

    <div class="header">

      <div>
        <h1>Dashboard</h1>
        <div class="subtitle">
          Customer feedback overview
        </div>
      </div>

      <button class="logout" id="logoutButton">
        Log Out
      </button>

    </div>


    <div class="stats">

      <div class="stat-card">
        <h2 id="totalFeedback">0</h2>
        <p>Total Feedback</p>
      </div>

      <div class="stat-card">
        <h2 id="averageRating">0</h2>
        <p>Average Rating</p>
      </div>

      <div class="stat-card">
        <h2 id="lowRatings">0</h2>
        <p>1–3 Star Feedback</p>
      </div>

    </div>


    <h2 class="section-title">
      Recent Feedback
    </h2>

    <div id="feedbackList">
      Loading feedback...
    </div>

  </main>

</div>


<script>

const SUPABASE_URL =
"https://intlhwmvldxdiytemjlr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";


const loginSection =
document.getElementById("loginSection");

const dashboard =
document.getElementById("dashboard");

const feedbackMenu =
document.getElementById("feedbackMenu");
  
async function login() {

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    document.getElementById("loginMessage")
      .textContent = "Incorrect email or password.";

    return;
  }

  localStorage.setItem(
    "reviewrise_token",
    data.access_token
  );

  showDashboard();

}


async function loadFeedback() {

  const token =
  localStorage.getItem("reviewrise_token");

  const response = await fetch(

    SUPABASE_URL +
    "/rest/v1/Feedback?select=*&order=created_at.desc",

    {
      headers: {

        "apikey": SUPABASE_KEY,

        "Authorization":
        "Bearer " + token
      }
    }
  );
  

  if (!response.ok) {

    document.getElementById("feedbackList")
      .textContent =
      "Could not load feedback.";

    return;
  }

const feedback = await response.json();
console.log(feedback);

  document.getElementById("totalFeedback")
    .textContent = feedback.length;


  let ratingTotal = 0;
  let lowRatings = 0;


  feedback.forEach(item => {

    ratingTotal += item.rating;

    if (item.rating <= 3) {
      lowRatings++;
    }

  });


  const average =
    feedback.length
    ? (ratingTotal / feedback.length).toFixed(1)
    : 0;


  document.getElementById("averageRating")
    .textContent = average;


  document.getElementById("lowRatings")
    .textContent = lowRatings;


  const list =
  document.getElementById("feedbackList");


  list.innerHTML = "";


  feedback.forEach(item => {

    const card =
    document.createElement("div");

    card.className =
    "feedback-card";


    const stars =
    "★".repeat(item.rating) +
    "☆".repeat(5 - item.rating);


    const date =
    new Date(item.created_at)
    .toLocaleString();


    card.innerHTML = `

      <div class="stars">
        ${stars}
      </div>

      <div class="feedback-text">
        ${item.feedback}
      </div>

      <div class="feedback-meta">
        ${item.business} • ${date}
      </div>

    `;


    list.appendChild(card);

  });

}


function showDashboard() {

  loginSection.style.display =
  "none";

  dashboard.style.display =
  "block";

  document.getElementById("mobileMenuBtn").style.display = "block";

  loadFeedback();

}

function logout() {

  localStorage.removeItem(
    "reviewrise_token"
  );

  dashboard.style.display =
  "none";

  loginSection.style.display =
  "flex";

}


document.getElementById("loginButton")
.addEventListener("click", login);


document.getElementById("logoutButton")
.addEventListener("click", logout);


if (
  localStorage.getItem(
    "reviewrise_token"
  )
) {

  showDashboard();

}
feedbackMenu.addEventListener("click", function () {
    window.location.href = "feedback.html";
});
  
function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const menuButton = document.getElementById("mobileMenuBtn");

    sidebar.classList.toggle("open");

    if (sidebar.classList.contains("open")) {
        menuButton.style.display = "none";
    } else {
        menuButton.style.display = "block";
    }
}
  
</script>

</body>
</html>
