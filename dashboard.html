<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewRise Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .login-card {
      max-width: 420px;
      margin: 100px auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      text-align: center;
    }

    .login-card p {
      text-align: center;
      color: #697386;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #172033;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loginError {
      color: #d93025;
      margin-top: 15px;
      text-align: center;
    }

    #dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card,
    .feedback-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .stat-card h2 {
      margin: 0;
      font-size: 28px;
    }

    .stat-card p {
      color: #697386;
      margin-bottom: 0;
    }

    .feedback-card {
      margin-bottom: 15px;
    }

    .rating {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .details {
      margin-top: 12px;
      color: #697386;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div id="loginSection" class="login-card">

    <h1>ReviewRise</h1>
    <p>Sign in to your dashboard</p>

    <input
      type="email"
      id="email"
      placeholder="Email address">

    <input
      type="password"
      id="password"
      placeholder="Password">

    <button id="loginButton">
      Sign In
    </button>

    <div id="loginError"></div>

  </div>


  <div id="dashboard" class="container">

    <div class="topbar">
      <div>
        <h1>ReviewRise Dashboard</h1>
        <p>Customer feedback overview</p>
      </div>

      <button class="logout" id="logoutButton">
        Log Out
      </button>
    </div>


    <div class="stats">

      <div class="stat-card">
        <h2 id="totalFeedback">0</h2>
        <p>Total Feedback</p>
      </div>

      <div class="stat-card">
        <h2 id="averageRating">0</h2>
        <p>Average Rating</p>
      </div>

      <div class="stat-card">
        <h2 id="lowRatings">0</h2>
        <p>1–3 Star Feedback</p>
      </div>

    </div>

    <div id="feedbackList">
      Loading feedback...
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://intlhwmvldxdiytemjlr.supabase.co";

const SUPABASE_KEY = "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

const loginSection =
  document.getElementById("loginSection");

const dashboard =
  document.getElementById("dashboard");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const loginError =
  document.getElementById("loginError");


loginButton.addEventListener("click", async function() {

  loginError.textContent = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },

      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    loginError.textContent =
      data.error_description ||
      data.msg ||
      "Login failed.";
    return;
  }

  localStorage.setItem(
    "reviewrise_access_token",
    data.access_token
  );

  showDashboard(data.access_token);

});


async function showDashboard(token) {

  loginSection.style.display = "none";
  dashboard.style.display = "block";

  await loadFeedback(token);

}


async function loadFeedback(token) {

  const feedbackList =
    document.getElementById("feedbackList");

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/Feedback?select=*&order=created_at.desc",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {
    feedbackList.innerHTML =
      "Could not load feedback.";
    return;
  }

  document.getElementById("totalFeedback")
    .textContent = data.length;

  let totalRating = 0;
  let lowRatings = 0;

  data.forEach(function(item) {

    totalRating += item.rating;

    if (item.rating <= 3) {
      lowRatings++;
    }

  });

  const average =
    data.length > 0
      ? (totalRating / data.length).toFixed(1)
      : "0";

  document.getElementById("averageRating")
    .textContent = average;

  document.getElementById("lowRatings")
    .textContent = lowRatings;

  feedbackList.innerHTML = "";

  data.forEach(function(item) {

    const card =
      document.createElement("div");

    card.className = "feedback-card";

    const rating =
      document.createElement("div");

    rating.className = "rating";
    rating.textContent =
      "★".repeat(item.rating) +
      "☆".repeat(5 - item.rating);

    const text =
      document.createElement("div");

    text.textContent = item.feedback;

    const details =
      document.createElement("div");

    details.className = "details";

    details.textContent =
      item.business +
      " • " +
      new Date(item.created_at).toLocaleString();

    card.appendChild(rating);
    card.appendChild(text);
    card.appendChild(details);

    feedbackList.appendChild(card);

  });

}


logoutButton.addEventListener("click", function() {

  localStorage.removeItem(
    "reviewrise_access_token"
  );

  dashboard.style.display = "none";
  loginSection.style.display = "block";

});


const savedToken =
  localStorage.getItem("reviewrise_access_token");

if (savedToken) {
  showDashboard(savedToken);
}

</script>

</body>
</html>
