<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Links - ReviewRise</title>
        
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f7fb;
    color: #172033;
}

.sidebar {
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 28px 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 40px;
}

.menu-item {
    display: block;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 8px;
    border-radius: 9px;
    cursor: pointer;
    color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
    background: #1f2937;
    color: white;
}

.main {
    margin-left: 240px;
    padding: 40px;
}

.main h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

.main p {
    margin: 0;
    color: #6b7280;
}

        @media (max-width: 800px) {

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 80%;
        max-width: 320px;
        height: 100vh;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1000;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .mobile-menu-btn {
        display: block;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: #111827;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 26px;
        cursor: pointer;
    }

.main {
    margin-left: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 90px 20px 30px;
}
}
        
</style>
</head>
    
<body>
    
    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    
<aside class="sidebar">
    <div class="logo">ReviewRise</div>

    <a href="dashboard.html" class="menu-item">Dashboard</a>

    <a href="feedback.html" class="menu-item">Feedback</a>

    <a href="analytics.html" class="menu-item">Analytics</a>

    <a href="review-links.html" class="menu-item active">Review Links</a>

    <div class="menu-item">QR & NFC</div>

    <div class="menu-item">Settings</div>
</aside>
    <main class="main">
    <h1>Review Links</h1>
    <p>Manage the links your customers use to share their experience.</p>
</main>

    <script>
const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const sidebar = document.querySelector(".sidebar");

mobileMenuBtn.addEventListener("click", function () {
    sidebar.classList.toggle("open");

    if (sidebar.classList.contains("open")) {
        mobileMenuBtn.style.display = "none";
    } else {
        mobileMenuBtn.style.display = "block";
    }
});

document.querySelectorAll(".menu-item").forEach(function (item) {
    item.addEventListener("click", function () {
        sidebar.classList.remove("open");
        mobileMenuBtn.style.display = "block";
    });
});
</script>
    
</body>
</html>
