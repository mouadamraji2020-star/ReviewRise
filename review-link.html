<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Links - ReviewRise</title>
        
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f7fb;
    color: #172033;
}

.sidebar {
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 28px 20px;
    box-sizing: border-box;
    z-index: 1000;
    transform: translateX(0);
    transition: transform 0.3s ease;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 40px;
}

.menu-item {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 8px;
    border-radius: 9px;
    cursor: pointer;
    color: #d1d5db;
    font-size: 15px;
    font-weight: 500;

    transition:
        background-color 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
}

.menu-item:hover {
    background: #1f2937;
    color: #ffffff;
    transform: translateX(3px);
}

.menu-item.active {
    background: #1f2937;
    color: #ffffff;
    font-weight: 600;
}

.main {
    margin-left: 240px;
    padding: 40px;
}

.main h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

.main p {
    margin: 0;
    color: #6b7280;
}
.close-menu-btn {
    display: none;
}
        @media (max-width: 800px) {
            .close-menu-btn {
    display: block;
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

.sidebar {
    display: block !important;
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100vh;
    background: #111827;
    z-index: 1000;

    transform: translateX(-100%);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.sidebar.open {
    transform: translateX(0);
}

.mobile-menu-btn {
    display: block;
    position: static;
    z-index: 1100;
    background: transparent;
    color: #111827;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}

.main {
    margin-left: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 25px 20px 30px;
}
}
/* ReviewRise top navigation */
.top-navbar {
    width: 100%;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-sizing: border-box;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: relative;
    z-index: 900;
}

.top-navbar-logo {
    font-size: 27px;
    font-weight: 700;
    color: #111827;
    margin-left: 18px;
}

.top-navbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
}

.navbar-icon {
    background: transparent;
    border: none;
    color: #111827;
    font-size: 28px;
    cursor: pointer;
}

/* Put the existing hamburger inside the navbar */
.top-navbar .mobile-menu-btn {
    position: static;
    display: block;
    background: transparent;
    color: #111827;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}
/* Smooth page transition */
body {
    opacity: 1;
    transition: opacity 0.25s ease;
}

body.page-leaving {
    opacity: 0;
}
        
</style>
</head>
    
<body>
    
 <div class="top-navbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>

    <div class="top-navbar-logo">ReviewRise</div>

    <div class="top-navbar-actions">
        <button class="navbar-icon" aria-label="Account">
            ♙
        </button>
    </div>
</div>
    
<aside class="sidebar">
    
    <button class="close-menu-btn" onclick="toggleSidebar()">×</button>
    
    <div class="logo">ReviewRise</div>

<div class="menu-item" onclick="smoothNavigate('dashboard.html')">
    Dashboard
</div>

<div class="menu-item" onclick="smoothNavigate('feedback.html')">
    Feedback
</div>

<div class="menu-item" onclick="smoothNavigate('analytics.html')">
    Analytics
</div>

<div class="menu-item active">
    Review Links
</div>

<div class="menu-item" onclick="smoothNavigate('qr-nfc.html')">
    QR & NFC
</div>

<div class="menu-item" onclick="smoothNavigate('settings.html')">
    Settings
</div>
</aside>
    <main class="main">
    <h1>Review Links</h1>
    <p>Manage the links your customers use to share their experience.</p>
</main>

    <script>

function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    sidebar.classList.toggle("open");
}
        
function smoothNavigate(page) {
    document.body.classList.add("page-leaving");

    setTimeout(function () {
        window.location.href = page;
    }, 250);
}
        
</script>
    
</body>
</html>
