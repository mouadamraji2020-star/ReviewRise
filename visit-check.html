<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visit counter check</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #10284d; }
  h1 { font-size: 22px; }
  .row { padding: 10px 12px; border: 1px solid #e0e8f2; border-radius: 10px; margin: 8px 0; font-size: 15px; word-break: break-word; }
  .ok { background: #e8f7ee; } .bad { background: #ffecec; } .info { background: #f4f8ff; }
</style>
</head>
<body>
<h1>Visit counter check</h1>
<p>This page sends one test visit and shows what happens. Send a screenshot of it to Claude.</p>
<div id="out"></div>
<script>
(function () {
  var out = document.getElementById("out");
  function line(text, cls) {
    var d = document.createElement("div");
    d.className = "row " + (cls || "info");
    d.textContent = text;
    out.appendChild(d);
  }
  var dnt = navigator.doNotTrack;
  var flag = null;
  try { flag = localStorage.getItem("rr_no_track"); } catch (e) { flag = "(blocked)"; }
  line("Browser: " + navigator.userAgent);
  line("Do Not Track setting: " + dnt + (dnt === "1" ? "  (the counter skips visitors who have this on)" : ""), dnt === "1" ? "bad" : "info");
  line("Marked as owner browser: " + flag + (flag === "1" ? "  (the counter skips this browser)" : ""), flag === "1" ? "bad" : "info");
  fetch("assets/site-pulse.js").then(function (r) {
    line("Counter script file: HTTP " + r.status, r.ok ? "ok" : "bad");
  }).catch(function (e) { line("Counter script file: blocked (" + e.message + ")", "bad"); });
  fetch("https://intlhwmvldxdiytemjlr.supabase.co/rest/v1/rpc/count_page_open", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA" },
    body: JSON.stringify({ p_page: "/ReviewRise/visit-check.html", p_referrer: null })
  }).then(function (r) {
    return r.text().then(function (t) { line("Test visit sent. Database answered: HTTP " + r.status + " " + t.slice(0, 300), r.ok ? "ok" : "bad"); });
  }).catch(function (e) { line("Test visit could not be sent (blocked by the browser or an extension): " + e.message, "bad"); });
})();
</script>
</body>
</html>
