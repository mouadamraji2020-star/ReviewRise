<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/demo-mode.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Payment receipt | ReviewRise</title>
<link rel="icon" type="image/png" href="assets/reviewrise-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f4f7fc; color: #10284d; font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 16px 56px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar a, .toolbar button {
    padding: 10px 16px; border-radius: 10px; font: 700 14px/1 Inter, sans-serif; cursor: pointer; text-decoration: none;
    border: 1px solid #cfe0fb; background: #fff; color: #1f6fe0;
  }
  .toolbar button { background: #2b7fff; border-color: #2b7fff; color: #fff; }
  .toolbar button:hover { background: #1f6fe0; }
  .receipt { background: #fff; border: 1px solid #e3eaf4; border-radius: 18px; padding: 40px 44px; box-shadow: 0 14px 36px rgba(16, 40, 80, 0.07); }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
  .brand img { height: 30px; width: auto; }
  .brand b { color: #2b7fff; }
  h1 { margin: 30px 0 4px; font-size: 26px; letter-spacing: -0.6px; }
  .meta { color: #6d7c92; font-size: 14px; }
  .lines { margin-top: 22px; }
  .line { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #eef2f7; font-size: 15px; }
  .line > span:first-child { color: #6d7c92; flex: none; }
  .line b { text-align: right; overflow-wrap: anywhere; }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 22px; padding: 16px 18px; background: #f4f8ff; border-radius: 12px; font-size: 19px; font-weight: 800; }
  .foot { margin-top: 26px; color: #8b9bb0; font-size: 13px; line-height: 1.55; }
  .state { text-align: center; padding: 56px 12px; color: #6d7c92; font-size: 15px; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .receipt { padding: 28px 20px; } h1 { font-size: 23px; } .line { flex-direction: column; gap: 2px; } .line b { text-align: left; } }
  @media print {
    body { background: #fff; }
    .wrap { max-width: none; padding: 0; }
    .toolbar, .rr-lang { display: none !important; }
    .receipt { border: 0; box-shadow: none; padding: 8px 0; }
  }
</style>
<script src="assets/i18n.js"></script>
</head>
<body>
<div class="wrap">
  <div class="toolbar" id="toolbar" hidden>
    <a href="settings.html#subscription">Back to Settings</a>
    <button type="button" id="printBtn">Print / Save as PDF</button>
  </div>
  <p class="state" id="state">Loading receipt...</p>
  <article class="receipt" id="receipt" hidden>
    <div class="brand"><img src="assets/reviewrise-logo.png" alt=""><span>Review<b>Rise</b></span></div>
    <h1>Payment receipt</h1>
    <div class="meta" id="metaLine" data-no-i18n></div>
    <div class="lines">
      <div class="line"><span>Customer</span><b id="rCustomer" data-no-i18n></b></div>
      <div class="line"><span>Plan</span><b><span id="rPlan" data-no-i18n></span> &middot; <span id="rCycle"></span></b></div>
      <div class="line"><span>Valid until</span><b id="rUntil" data-no-i18n></b></div>
      <div class="line"><span>Payment method</span><b id="rMethod"></b></div>
    </div>
    <div class="total"><span>Total paid</span><span id="rTotal" data-no-i18n></span></div>
    <p class="foot">Thank you for choosing ReviewRise.<br>This is a payment receipt, not a tax invoice. Questions? Contact us from the Help Center.</p>
  </article>
</div>
<script>
(function () {
  var SUPABASE_URL = "https://intlhwmvldxdiytemjlr.supabase.co";
  var SUPABASE_KEY = "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";
  var state = document.getElementById("state");

  function locale() {
    var l = "en";
    try { l = localStorage.getItem("rr_lang") || "en"; } catch (e) {}
    return l === "fr" ? "fr-FR" : l === "de" ? "de-DE" : "en-US";
  }

  function fail(message) {
    state.hidden = false;
    state.textContent = message;
    document.getElementById("receipt").hidden = true;
    document.getElementById("toolbar").hidden = false;
    document.getElementById("printBtn").hidden = true;
  }

  async function freshToken() {
    var refresh = localStorage.getItem("reviewrise_refresh_token");
    if (!refresh) return null;
    try {
      var r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refresh })
      });
      if (!r.ok) return null;
      var d = await r.json();
      if (!d.access_token) return null;
      localStorage.setItem("reviewrise_token", d.access_token);
      if (d.refresh_token) localStorage.setItem("reviewrise_refresh_token", d.refresh_token);
      return d.access_token;
    } catch (e) { return null; }
  }

  async function fetchPayments(token) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/get_my_payments", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: "{}"
    });
  }

  async function run() {
    var id = new URLSearchParams(location.search).get("id") || "";
    if (!/^\d+$/.test(id)) { fail("This receipt could not be found."); return; }
    var token = localStorage.getItem("reviewrise_token");
    if (!token) { location.href = "dashboard.html"; return; }
    var response;
    try {
      response = await fetchPayments(token);
      if (response.status === 401) {
        token = await freshToken();
        if (!token) { location.href = "dashboard.html"; return; }
        response = await fetchPayments(token);
      }
    } catch (e) { fail("This receipt could not be loaded. Please try again."); return; }
    if (!response.ok) { fail("This receipt could not be loaded. Please try again."); return; }
    var rows = await response.json();
    var p = (Array.isArray(rows) ? rows : []).filter(function (r) { return String(r.id) === id; })[0];
    if (!p) { fail("This receipt could not be found."); return; }

    var when = new Date(p.created_at);
    var until = new Date(p.period_end);
    var loc = locale();
    var fmt = function (d) { return isNaN(d.getTime()) ? "-" : d.toLocaleDateString(loc, { day: "numeric", month: "long", year: "numeric" }); };
    var number = "RR-" + (isNaN(when.getTime()) ? "" : when.getFullYear() + "-") + String(p.id).padStart(4, "0");
    document.getElementById("metaLine").textContent = number + "  ·  " + fmt(when);
    document.getElementById("rCustomer").textContent = p.customer_email || "";
    document.getElementById("rPlan").textContent = p.plan === "business" ? "Business" : "Pro";
    document.getElementById("rCycle").textContent = p.billing_cycle === "yearly" ? "Yearly" : "Monthly";
    document.getElementById("rUntil").textContent = fmt(until);
    document.getElementById("rMethod").textContent = p.method || "-";
    var amount = Number(p.amount);
    document.getElementById("rTotal").textContent = (isFinite(amount) ? amount.toLocaleString(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "") + " " + (p.currency || "");
    document.title = number + " | ReviewRise";
    state.hidden = true;
    document.getElementById("receipt").hidden = false;
    document.getElementById("toolbar").hidden = false;
  }

  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
  run();
})();
</script>
</body>
</html>
