<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewRise Analytics</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7f8;
    color: #172033;
}

.sidebar {
  width: 240px;
  height: 100vh;
  background: #111827;
  color: white;
  position: fixed;
  left: 0;
  top: 0;
  padding: 28px 20px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 40px;
}

.menu-item {
  display: block;
  text-decoration: none;
  padding: 13px 15px;
  margin-bottom: 8px;
  border-radius: 9px;
  cursor: pointer;
  color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
  background: #1f2937;
  color: white;
}

.main {
  margin-left: 240px;
  padding: 40px;
}

h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 40px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.stat-card {
    background: white;
    padding: 25px;
    border-radius: 14px;
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
}

.stat-label {
    color: #777;
    margin-top: 8px;
}

.chart-card {
    background: white;
    margin-top: 25px;
    padding: 30px;
    border-radius: 14px;
}

.rating-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 18px 0;
}

.rating-label {
    width: 55px;
}

.bar-background {
    flex: 1;
    height: 14px;
    background: #e7e9ed;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #172033;
    border-radius: 20px;
}

    .mobile-menu-btn {
    display: none;
}
    .close-menu-btn {
    display: none;
}
    
@media (max-width: 800px) {

.close-menu-btn {
    display: block !important;
    position: absolute !important;
    top: 12px !important;
    right: 12px !important;

    width: auto !important;
    height: auto !important;
    padding: 0 !important;
    margin: 0 !important;

    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;

    color: white !important;
    font-size: 28px !important;
    font-weight: normal !important;
    line-height: 1 !important;

    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
}

    .mobile-menu-btn {
    display: block;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1100;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 26px;
    cursor: pointer;
}
    
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.45s ease;
        z-index: 1000;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0 !important;
        width: 100% !important;
        padding: 25px 20px 30px !important;
        box-sizing: border-box;
    }

    .stats {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .stat-card {
        width: 100%;
        box-sizing: border-box;
    }
}

    /* ReviewRise top navigation */
.top-navbar {
    width: 100%;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-sizing: border-box;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: relative;
    z-index: 900;
}

.top-navbar-logo {
    font-size: 27px;
    font-weight: 700;
    color: #111827;
    margin-left: 18px;
    position: absolute;
    left: 50px;
}

.top-navbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
}

.navbar-icon {
    background: transparent;
    border: none;
    color: #111827;
    font-size: 28px;
    cursor: pointer;
}

/* Put the existing hamburger inside the navbar */
.top-navbar .mobile-menu-btn {
    position: static;
    display: block;
    background: transparent;
    color: #111827;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}

/* LAPTOP ONLY */
@media (min-width: 801px) {

    .mobile-menu-btn {
        display: block !important;
        position: static !important;
        background: transparent !important;
        color: #111827 !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 30px !important;
        cursor: pointer;
    }

    .sidebar {
        display: block !important;
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: #111827;
        z-index: 1000;

        transform: translateX(-100%);
        transition: transform 0.45s ease;
    }

    .sidebar.open {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: #111827;
        z-index: 1000;
        padding: 24px 16px;
        box-sizing: border-box;
        transform: translateX(0);
    }
}

.sidebar.open .logo {
    display: block;
    color: white;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 30px;
}

.sidebar.open .close-menu-btn {
    display: block;
    position: absolute;
    top: 18px;
    right: 18px;
    background: transparent;
    border: none;
    color: white;
    font-size: 26px;
    cursor: pointer;
}

.sidebar.open .menu-item {
    display: block;
    color: #e5e7eb;
    text-decoration: none;
    padding: 12px 14px;
    margin-bottom: 6px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    transition: background 0.2s ease, color 0.2s ease;
}

.sidebar.open .menu-item:hover {
    background: #1f2937;
    color: #ffffff;
}

.sidebar.open .menu-item.active {
    background: #2563eb;
    color: #ffffff;
    font-weight: 600;
}

/* Smooth page transition */
body {
    opacity: 1;
    transition: opacity 0.25s ease;
}

body.page-leaving {
    opacity: 0;
}    
</style>
</head>

<body>

<div class="top-navbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>

    <div class="top-navbar-logo">ReviewRise</div>

    <div class="top-navbar-actions">
        <button class="navbar-icon" aria-label="Account">
            ♙
        </button>
    </div>
</div>
    
<aside class="sidebar">
    
<button class="close-menu-btn" onclick="toggleSidebar()">×</button>
    
    <div class="logo">ReviewRise</div>

    <div class="menu-item" onclick="smoothNavigate('dashboard.html')">Dashboard</div>

<div class="menu-item" onclick="smoothNavigate('feedback.html')">Feedback</div>

<div class="menu-item active" onclick="smoothNavigate('analytics.html')">Analytics</div>
    
<div class="menu-item" onclick="smoothNavigate('review-link.html')">Review Links</div>

    <div class="menu-item">QR & NFC</div>

    <div class="menu-item">Settings</div>

</aside>

<main class="main">

    <h1>Analytics</h1>

    <div class="subtitle">
        Understand your customer feedback and ratings.
    </div>

    <div class="stats">

        <div class="stat-card">
            <div class="stat-number" id="totalFeedback">0</div>
            <div class="stat-label">Total Feedback</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="averageRating">0.0</div>
            <div class="stat-label">Average Rating</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="lowRatings">0</div>
            <div class="stat-label">1–3 Star Feedback</div>
        </div>

    </div>

    <div class="chart-card">

        <h2>Rating Distribution</h2>

        <div id="ratingChart"></div>

    </div>

</main>

<script>

const SUPABASE_URL =
"https://intlhwmvldxdiytemjlr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

function restoreAnalyticsCache() {
    const cached = localStorage.getItem("reviewrise_analytics_cache");

    if (!cached) return;

    try {
        const data = JSON.parse(cached);

        document.getElementById("totalFeedback").textContent =
            data.totalFeedback;

        document.getElementById("averageRating").textContent =
            data.averageRating;

        document.getElementById("lowRatings").textContent =
            data.lowRatings;

        if (data.ratingChartHTML) {
            document.getElementById("ratingChart").innerHTML =
                data.ratingChartHTML;
        }

    } catch (error) {
        console.error("Analytics cache error:", error);
    }
}

function saveAnalyticsCache() {
    const data = {
        totalFeedback:
            document.getElementById("totalFeedback").textContent,

        averageRating:
            document.getElementById("averageRating").textContent,

        lowRatings:
            document.getElementById("lowRatings").textContent,

        ratingChartHTML:
            document.getElementById("ratingChart").innerHTML
    };

    localStorage.setItem(
        "reviewrise_analytics_cache",
        JSON.stringify(data)
    );
}    

console.log("TOKEN FUNCTION VERSION 2");
    
async function getValidAccessToken() {
    const currentToken = localStorage.getItem("reviewrise_token");
    const refreshToken = localStorage.getItem("reviewrise_refresh_token");

    if (!refreshToken) {
        return currentToken;
    }

    try {
        const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    refresh_token: refreshToken
                })
            }
        );

        if (!response.ok) {
            return currentToken;
        }

        const data = await response.json();

        localStorage.setItem(
            "reviewrise_token",
            data.access_token
        );

        if (data.refresh_token) {
            localStorage.setItem(
                "reviewrise_refresh_token",
                data.refresh_token
            );
        }

        return data.access_token;

    } catch (error) {
        console.error("Token refresh failed:", error);
        return currentToken;
    }
}
    
async function loadAnalytics() {

const token = await getValidAccessToken();
    
    if (!token) {
    window.location.href = "dashboard.html";
    return;
}
    
    const response = await fetch(
        SUPABASE_URL + "/rest/v1/Feedback?select=rating",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token
           }
        }
    );

    const feedback = await response.json();
    
    console.log("STATUS:", response.status);
    console.log("FEEDBACK:", feedback);
    
    const total = feedback.length;

    document.getElementById("totalFeedback").textContent = total;

    const average = total
        ? (
            feedback.reduce((sum, item) => sum + item.rating, 0) / total
          ).toFixed(1)
        : "0.0";

    document.getElementById("averageRating").textContent = average;

    const lowRatings =
        feedback.filter(item => item.rating <= 3).length;

    document.getElementById("lowRatings").textContent = lowRatings;

    const chart = document.getElementById("ratingChart");

    chart.innerHTML = "";

    for (let rating = 5; rating >= 1; rating--) {

        const count =
            feedback.filter(item => item.rating === rating).length;

        const percentage =
            total ? (count / total) * 100 : 0;

        chart.innerHTML += `
            <div class="rating-row">

                <div class="rating-label">
                    ${rating} ★
                </div>

                <div class="bar-background">
                    <div
                        class="bar"
                        style="width:${percentage}%">
                    </div>
                </div>

                <div>${count}</div>

            </div>
        `;
    }
    saveAnalyticsCache();
}

restoreAnalyticsCache();
loadAnalytics();

</script>

<script>  

function smoothNavigate(page) {
    document.body.classList.add("page-leaving");

    setTimeout(function () {
        window.location.href = page;
    }, 250);
}
    
function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const menuButton = document.getElementById("mobileMenuBtn");

    // PHONE - keep existing behavior
    if (window.innerWidth <= 800) {
        sidebar.classList.toggle("open");

        if (sidebar.classList.contains("open")) {
            menuButton.style.display = "none";
        } else {
            menuButton.style.display = "block";
        }

        return;
    }

    // LAPTOP - smooth sidebar
    sidebar.classList.toggle("open");
}
    
</script>

</body>
</html>
