<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewRise Analytics</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7f8;
    color: #172033;
}

.sidebar {
  width: 240px;
  height: 100vh;
  background: #111827;
  color: white;
  position: fixed;
  left: 0;
  top: 0;
  padding: 28px 20px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 40px;
}

.menu-item {
  display: block;
  text-decoration: none;
  padding: 13px 15px;
  margin-bottom: 8px;
  border-radius: 9px;
  cursor: pointer;
  color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
  background: #1f2937;
  color: white;
}

.main {
  margin-left: 240px;
  padding: 40px;
}

h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 40px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.stat-card {
    background: white;
    padding: 25px;
    border-radius: 14px;
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
}

.stat-label {
    color: #777;
    margin-top: 8px;
}

.chart-card {
    background: white;
    margin-top: 25px;
    padding: 30px;
    border-radius: 14px;
}

.rating-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 18px 0;
}

.rating-label {
    width: 55px;
}

.bar-background {
    flex: 1;
    height: 14px;
    background: #e7e9ed;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #172033;
    border-radius: 20px;
}

    .mobile-menu-btn {
    display: none;
}
    
@media (max-width: 800px) {

    .mobile-menu-btn {
    display: block;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1100;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 26px;
    cursor: pointer;
}
    
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1000;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0 !important;
        width: 100% !important;
        padding: 100px 20px 30px !important;
        box-sizing: border-box;
    }

    .stats {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .stat-card {
        width: 100%;
        box-sizing: border-box;
    }
}
    
</style>
</head>

<body>

  <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    
<aside class="sidebar">

    <div class="logo">ReviewRise</div>

    <a href="dashboard.html" class="menu-item">Dashboard</a>

<div class="menu-item" onclick="window.location.href='feedback.html'">Feedback</div>

    <a href="analytics.html" class="menu-item active">Analytics</a>

<a href="review-link.html" class="menu-item">Review Links</a>

    <div class="menu-item">QR & NFC</div>

    <div class="menu-item">Settings</div>

</aside>

<main class="main">

    <h1>Analytics</h1>

    <div class="subtitle">
        Understand your customer feedback and ratings.
    </div>

    <div class="stats">

        <div class="stat-card">
            <div class="stat-number" id="totalFeedback">0</div>
            <div class="stat-label">Total Feedback</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="averageRating">0.0</div>
            <div class="stat-label">Average Rating</div>
        </div>

        <div class="stat-card">
            <div class="stat-number" id="lowRatings">0</div>
            <div class="stat-label">1–3 Star Feedback</div>
        </div>

    </div>

    <div class="chart-card">

        <h2>Rating Distribution</h2>

        <div id="ratingChart"></div>

    </div>

</main>

<script>

const SUPABASE_URL =
"https://intlhwmvldxdiytemjlr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

async function loadAnalytics() {

    const token = localStorage.getItem("reviewrise_token");
    
    const response = await fetch(
        SUPABASE_URL + "/rest/v1/Feedback?select=rating",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token
           }
        }
    );

    const feedback = await response.json();
    
    console.log("STATUS:", response.status);
    console.log("FEEDBACK:", feedback);
    
    const total = feedback.length;

    document.getElementById("totalFeedback").textContent = total;

    const average = total
        ? (
            feedback.reduce((sum, item) => sum + item.rating, 0) / total
          ).toFixed(1)
        : "0.0";

    document.getElementById("averageRating").textContent = average;

    const lowRatings =
        feedback.filter(item => item.rating <= 3).length;

    document.getElementById("lowRatings").textContent = lowRatings;

    const chart = document.getElementById("ratingChart");

    chart.innerHTML = "";

    for (let rating = 5; rating >= 1; rating--) {

        const count =
            feedback.filter(item => item.rating === rating).length;

        const percentage =
            total ? (count / total) * 100 : 0;

        chart.innerHTML += `
            <div class="rating-row">

                <div class="rating-label">
                    ${rating} ★
                </div>

                <div class="bar-background">
                    <div
                        class="bar"
                        style="width:${percentage}%">
                    </div>
                </div>

                <div>${count}</div>

            </div>
        `;
    }
}

loadAnalytics();

</script>

<script>    
const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const sidebar = document.querySelector(".sidebar");

mobileMenuBtn.addEventListener("click", function () {
    sidebar.classList.toggle("open");
});

document.querySelectorAll(".menu-item").forEach(function (item) {
    item.addEventListener("click", function () {
        sidebar.classList.remove("open");
    });
});
</script>

</body>
</html>
