<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Share Your Experience | ReviewRise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,.08), transparent 35%),
        radial-gradient(circle at bottom right, rgba(16,185,129,.06), transparent 35%),
        #f7f8fc;
      color: #171923;
      display: flex;
      flex-direction: column;
    }

    /* ---------- PAGE ---------- */

.page {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 20px 18px;
}

    .review-card {
      width: 100%;
      max-width: 560px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(17,24,39,.07);
      border-radius: 26px;
      padding: 52px 46px 44px;
      text-align: center;
      box-shadow:
        0 25px 70px rgba(15,23,42,.08),
        0 4px 14px rgba(15,23,42,.03);
    }

    /* ---------- BUSINESS ---------- */

.business-logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;
  border-radius: 20px;

  background: #ffffff;
  border: 1px solid #e8ebf0;

  color: #172033;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 29px;
  font-weight: 750;

  overflow: hidden;

  box-shadow:
    0 10px 30px rgba(15, 23, 42, 0.08),
    0 2px 6px rgba(15, 23, 42, 0.04);
}
    .business-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 8px;
}

    .business-name {
      font-size: 16px;
      font-weight: 650;
      color: #5d6472;
      margin-bottom: 13px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.18;
      letter-spacing: -1px;
      font-weight: 750;
      color: #151823;
      margin-bottom: 14px;
    }

    .description {
      max-width: 410px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 1.65;
      color: #737986;
    }

    /* ---------- STARS ---------- */

    .rating-area {
      margin-top: 38px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .star {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 46px;
      line-height: 1;
      color: #d9dde5;
      padding: 2px;
      transition:
        color .18s ease,
        transform .18s ease,
        filter .18s ease;
    }

    .star:hover {
      transform: translateY(-4px) scale(1.07);
    }

    .star.active {
      color: #f5b82e;
      filter: drop-shadow(0 5px 8px rgba(245,184,46,.22));
    }

    .rating-label {
      height: 24px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: 650;
      color: #525866;
      transition: .2s;
    }

    .hint {
      margin-top: 5px;
      font-size: 13px;
      color: #a0a5af;
    }

    /* ---------- DIVIDER ---------- */

    .divider {
      width: 100%;
      height: 1px;
      background: #eef0f4;
      margin: 38px 0 25px;
    }

    /* ---------- TRUST ---------- */

    .trust {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #9298a4;
    }

    .shield {
      width: 17px;
      height: 17px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: #777e8c;
    }

    /* ---------- FOOTER ---------- */

footer {
  padding: 10px 20px 28px;
  text-align: center;
  font-size: 13px;
  color: #a1a6b0;
}

    footer strong {
      color: #626875;
      font-weight: 650;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 600px) {

.page {
  flex: 1;
  align-items: center;
  padding: 22px 14px;
}

  .review-card {
    max-width: 100%;
    padding: 28px 22px 24px;
    border-radius: 24px;
  }

.business-logo {
  width: 60px;
  height: 60px;
  margin-bottom: 14px;
  border-radius: 16px;
  font-size: 23px;
}

  .business-name {
    font-size: 15px;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 29px;
    line-height: 1.15;
    letter-spacing: -0.7px;
    margin-bottom: 13px;
  }

  .description {
    max-width: 330px;
    font-size: 15px;
    line-height: 1.55;
  }

  .rating-area {
    margin-top: 22px;
  }

  .stars {
    gap: 5px;
  }

  .star {
    font-size: 40px;
  }

  .rating-label {
    margin-top: 15px;
    font-size: 15px;
  }

  .divider {
    margin: 28px 0 18px;
  }

  .trust {
    font-size: 12.5px;
  }

  footer {
    padding: 8px 20px 28px;
    font-size: 12.5px;
  }
}
  </style>
</head>

<body>

  <!-- CUSTOMER REVIEW -->

  <main class="page">

    <section class="review-card">

      <div class="business-logo" id="businessLogo">
        B
      </div>

      <div class="business-name" id="businessName">
        Your Business
      </div>

      <h1>How was your experience?</h1>

      <p class="description">
        We'd love to hear about your recent experience.
        Your feedback helps us continue to improve.
      </p>


      <div class="rating-area">

        <div class="stars" id="stars">

          <button class="star" data-rating="1" aria-label="1 star">★</button>
          <button class="star" data-rating="2" aria-label="2 stars">★</button>
          <button class="star" data-rating="3" aria-label="3 stars">★</button>
          <button class="star" data-rating="4" aria-label="4 stars">★</button>
          <button class="star" data-rating="5" aria-label="5 stars">★</button>

        </div>

        <div class="rating-label" id="ratingLabel">
          Select your rating
        </div>

        <div class="hint">
          Tap a star to continue
        </div>

      </div>


      <div class="divider"></div>


      <div class="trust">

        <span class="shield">✓</span>

        Your feedback is secure and appreciated

      </div>

    </section>

  </main>


  <footer>
    Powered by <strong>ReviewRise</strong>
  </footer>


  <script>

   const SUPABASE_URL = "https://intl1hwmv1dxdiytemjlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

async function loadBusiness() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) return;

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/Reviewlinks?id=eq." +
        encodeURIComponent(id) +
        "&select=business_name,google_review_link",
        {
            headers: {
                "apikey": SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {
        console.error("Could not load business");
        return;
    }

    const data = await response.json();

    if (data.length === 0) return;

    const business = data[0];

    document.getElementById("businessName").textContent =
        business.business_name;

    document.getElementById("businessLogo").textContent =
        business.business_name.charAt(0).toUpperCase();

    window.businessGoogleReviewLink =
        business.google_review_link;
}

loadBusiness();
    
    const stars = document.querySelectorAll(".star");
    const ratingLabel = document.getElementById("ratingLabel");

    const labels = {
      1: "Very disappointing",
      2: "Could be better",
      3: "Good",
      4: "Great experience",
      5: "Excellent!"
    };


    stars.forEach(star => {

      star.addEventListener("mouseenter", function () {

        const rating = Number(this.dataset.rating);

        highlightStars(rating);

        ratingLabel.textContent = labels[rating];

      });


      star.addEventListener("click", function () {

        const rating = Number(this.dataset.rating);

        highlightStars(rating);

        ratingLabel.textContent = labels[rating];

        handleRating(rating);

      });

    });


    document.getElementById("stars").addEventListener("mouseleave", function () {

      const selected = document.querySelector(".star.selected");

      if (!selected) {

        highlightStars(0);

        ratingLabel.textContent = "Select your rating";

      } else {

        const rating = Number(selected.dataset.rating);

        highlightStars(rating);

        ratingLabel.textContent = labels[rating];

      }

    });


    function highlightStars(rating) {

      stars.forEach(star => {

        const value = Number(star.dataset.rating);

        star.classList.toggle("active", value <= rating);

      });

    }


    function handleRating(rating) {

      stars.forEach(star => {
        star.classList.remove("selected");
      });

      stars[rating - 1].classList.add("selected");


      /*
        NEXT STEP:

        Here we will connect this page to Supabase.

        The rating will belong to the correct
        ReviewRise business/review link.

        Then we will show the next customer step.
      */

      console.log("Selected rating:", rating);

    }

async function loadBusinessFromReviewLink() {
    const params = new URLSearchParams(window.location.search);
    const reviewLinkId = params.get("id");

    if (!reviewLinkId) return;

    try {
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/Reviewlinks?id=eq." +
            encodeURIComponent(reviewLinkId) +
            "&select=id,business_name,google_review_link",
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            console.error("Could not load review link:", data);
            return;
        }

        if (!data.length) {
            console.error("Review link not found.");
            return;
        }

        const link = data[0];

        document.getElementById("businessName").textContent =
            link.business_name;

        const logo = document.getElementById("businessLogo");

        if (logo && link.business_name) {
            logo.textContent =
                link.business_name.charAt(0).toUpperCase();
        }

        window.reviewRiseGoogleReviewUrl =
            link.google_review_link;

    } catch (error) {
        console.error("Error loading business:", error);
    }
}

loadBusinessFromReviewLink();
    
  </script>

</body>
</html>
