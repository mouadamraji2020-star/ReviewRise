<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReviewBoost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #172033;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #697386;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 25px;
    }

    .star {
      border: none;
      background: none;
      font-size: 42px;
      cursor: pointer;
      color: #d6d9df;
      padding: 2px;
      transition: transform 0.2s, color 0.2s;
    }

    .star:hover {
      transform: scale(1.08);
    }

    .star.active {
      color: #ffc107;
      transform: scale(1.08);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #f5f7fb;
      line-height: 1.5;
    }

    .google-button {
      display: none;
      margin-top: 15px;
      padding: 15px 20px;
      border-radius: 12px;
      background: #172033;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .google-button:hover {
      opacity: 0.9;
    }

    #feedbackForm {
      display: none;
      margin-top: 20px;
    }

    #feedbackText {
      width: 100%;
      min-height: 120px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: none;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    #submitFeedback {
      margin-top: 12px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #172033;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    #submitFeedback:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9aa1ad;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">R</div>

    <h1>How was your experience?</h1>

    <p class="subtitle">
      Your feedback helps us improve and provide a better experience.
    </p>

    <div class="stars">

      <button class="star" type="button" data-rating="1">★</button>
      <button class="star" type="button" data-rating="2">★</button>
      <button class="star" type="button" data-rating="3">★</button>
      <button class="star" type="button" data-rating="4">★</button>
      <button class="star" type="button" data-rating="5">★</button>

    </div>

    <div class="message" id="message"></div>

    <a
      id="googleButton"
      class="google-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      Leave us a Google review
    </a>

    <div id="feedbackForm">

      <textarea
        id="feedbackText"
        placeholder="Tell us what went wrong and how we can improve...">
      </textarea>

      <button
        id="submitFeedback"
        type="button">
        Submit Feedback
      </button>

    </div>

    <div class="footer">
      Powered by ReviewBoost
    </div>

  </div>


  <script>
const SUPABASE_URL = "https://intl...supabase.co";
const SUPABASE_KEY = "YOUR_EXISTING_PUBLISHABLE_KEY";

const params = new URLSearchParams(window.location.search);
const reviewLinkId = params.get("id");

async function loadBusiness() {

  if (!reviewLinkId) {
    console.error("No review link ID found.");
    return;
  }

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/Reviewlinks?id=eq." +
    encodeURIComponent(reviewLinkId) +
    "&select=business_name",
    {
      headers: {
        "apikey": SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    console.error("Could not load business.");
    return;
  }

  const data = await response.json();

  if (!data.length) {
    console.error("Business not found.");
    return;
  }

  const businessName = data[0].business_name;

  document.getElementById("businessName").textContent = businessName;

  document.getElementById("businessLogo").textContent =
    businessName.charAt(0).toUpperCase();
}

loadBusiness();
    
    const GOOGLE_REVIEW_URL =
      "https://search.google.com/local/writereview?placeid=ChIJOdbspvWBCw0R2cVHjfyGvHk";
    let selectedRating = 0;
    const stars = document.querySelectorAll(".star");
    const message = document.getElementById("message");
    const googleButton = document.getElementById("googleButton");
    const feedbackForm = document.getElementById("feedbackForm");
    const feedbackText = document.getElementById("feedbackText");
    const submitFeedback = document.getElementById("submitFeedback");


    // STAR RATING

    stars.forEach(function(star) {

      star.addEventListener("click", function() {

        const rating = Number(this.dataset.rating);
        selectedRating = rating;

        // Remove the active class from every star
        stars.forEach(function(s) {
          s.classList.remove("active");
        });


        // Add active class to the selected stars
        for (let i = 0; i < rating; i++) {
          stars[i].classList.add("active");
        }


        // Show message
        message.style.display = "block";


        // 4 or 5 stars
if (rating >= 4) {

  window.location.href = GOOGLE_REVIEW_URL;

}


        // 1, 2 or 3 stars
        else {

          message.innerHTML =
            "We're sorry we didn't meet your expectations. Please tell us how we can improve.";

          googleButton.style.display = "none";

          feedbackForm.style.display = "block";

        }

      });

    });


    // SUBMIT FEEDBACK

submitFeedback.addEventListener("click", async function() {

  const feedback = feedbackText.value.trim();

  if (feedback === "") {
    alert("Please write your feedback first.");
    return;
  }

const SUPABASE_URL = "https://intlhwmvldxdiytemjlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

const response = await fetch(
  SUPABASE_URL + "/rest/v1/Feedback",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
"apikey": SUPABASE_KEY,
"Prefer": "return=minimal"
    },
    body: JSON.stringify({
      rating: selectedRating,
      feedback: feedback,
      business: "Appart-Hôtel Flamant Rose"
    })
  }
);

  if (response.ok) {

    feedbackForm.style.display = "none";
    googleButton.style.display = "none";

    message.style.display = "block";

    message.innerHTML = `
      <strong>Thank you for your feedback!</strong><br><br>
      We really appreciate you taking the time to share your experience.
      Your feedback helps us improve our service.
    `;

    feedbackText.value = "";

  } else {

    alert("Something went wrong. Please try again.");

  }

});

  </script>

</body>
</html>
