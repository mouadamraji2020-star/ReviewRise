<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewBoost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #172033;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #697386;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 25px;
    }

    .star {
      border: none;
      background: none;
      font-size: 42px;
      cursor: pointer;
      color: #d6d9df;
      transition: 0.2s;
      padding: 2px;
    }

    .star:hover,
    .star.active {
      color: #ffc107;
      transform: scale(1.08);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #f5f7fb;
      line-height: 1.5;
    }

    .google-button {
      display: none;
      margin-top: 15px;
      padding: 15px 20px;
      border-radius: 12px;
      background: #172033;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9aa1ad;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">R</div>

    <h1>How was your experience?</h1>

    <p class="subtitle">
      Your feedback helps us improve and provide a better experience.
    </p>

    <div class="stars">
      <button class="star" data-rating="1">★</button>
      <button class="star" data-rating="2">★</button>
      <button class="star" data-rating="3">★</button>
      <button class="star" data-rating="4">★</button>
      <button class="star" data-rating="5">★</button>
    </div>

    <div class="message" id="message"></div>
<div id="feedbackForm" style="display:none; margin-top:20px;">

  <textarea
    id="feedbackText"
    placeholder="Tell us what went wrong and how we can improve..."
    style="width:100%; min-height:120px; padding:15px; border:1px solid #ddd; border-radius:12px; resize:none; font-family:Arial;">
  </textarea>

  <button
    id="submitFeedback"
    style="margin-top:12px; width:100%; padding:15px; border:none; border-radius:12px; background:#172033; color:white; font-weight:bold;">
    Submit Feedback
  </button>

</div>
    <a
      id="googleButton"
      class="google-button"
      href="#"
      target="_blank">
      Leave us a Google review
    </a>

    <div class="footer">
      Powered by ReviewBoost
    </div>

  </div>

  <script>

    const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJOdbspvWBCw0R2cVHjfyGvHk";

    const stars = document.querySelectorAll(".star");
    const message = document.getElementById("message");
    const googleButton = document.getElementById("googleButton");
const feedbackForm = document.getElementById("feedbackForm");
const feedbackText = document.getElementById("feedbackText");
const submitFeedback = document.getElementById("submitFeedback");
    stars.forEach(star => {

      star.addEventListener("click", () => {

        const rating = Number(star.dataset.rating);

        stars.forEach(s => {
          s.classList.toggle(
            "active",
            Number(s.dataset.rating) <= rating
          );
        });

        message.style.display = "block";

        if (rating >= 4) {

          message.innerHTML =
            "Thank you! We're happy you enjoyed your experience.";

          googleButton.style.display = "inline-block";
          googleButton.href = GOOGLE_REVIEW_URL;
feedbackForm.style.display = "none";
        } else {
feedbackForm.style.display = "block";
          message.innerHTML =
            "We're sorry we didn't meet your expectations. Please tell us how we can improve.";

          googleButton.style.display = "none";
        }

      });

    });
submitFeedback.addEventListener("click", () => {

  const feedback = feedbackText.value.trim();

  if (feedback === "") {
    alert("Please tell us what happened.");
    return;
  }

  message.innerHTML = "Thank you for your feedback. We appreciate your honesty.";
  feedbackText.value = "";

});
  </script>

</body>
</html>
