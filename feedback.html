<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - ReviewRise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

.sidebar {
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 28px 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 40px;
}

.menu-item {
    display: block;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 8px;
    border-radius: 9px;
    cursor: pointer;
    color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
    background: #1f2937;
    color: white;
}

    .main {
      margin-left: 240px;
      padding: 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .feedback-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .stars {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-top: 10px;
    }

    .mobile-menu-btn {
    display: none;
}
    .close-menu-btn {
    display: none;
}
    @media (max-width: 800px) {
      .close-menu-btn {
    display: block;
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

      .main {
    margin-left: 0 !important;
    width: 100% !important;
    padding: 25px 20px 30px !important;
    box-sizing: border-box;
}

#feedbackList {
    width: 100% !important;
}

.feedback-card {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box;
}
      
      .mobile-menu-btn {
    display: block;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 999;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 24px;
    cursor: pointer;
}
      
    .sidebar {
        display: none;
    }

  .sidebar.open {
    display: block;
    width: 240px;
    z-index: 1000;
}
}
/* ReviewRise top navigation */
.top-navbar {
    width: 100%;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-sizing: border-box;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: relative;
    z-index: 900;
}

.top-navbar-logo {
    font-size: 27px;
    font-weight: 700;
    color: #111827;
    margin-left: 18px;
}

.top-navbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
}

.navbar-icon {
    background: transparent;
    border: none;
    color: #111827;
    font-size: 28px;
    cursor: pointer;
}

/* Put the existing hamburger inside the navbar */
.top-navbar .mobile-menu-btn {
    position: static;
    display: block;
    background: transparent;
    color: #111827;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}

/* LAPTOP ONLY */
@media (min-width: 801px) {

    .mobile-menu-btn {
        display: block !important;
        position: static !important;
        background: transparent !important;
        color: #111827 !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 30px !important;
        cursor: pointer;
    }

    .sidebar {
        display: block !important;
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: #111827;
        z-index: 1000;

        transform: translateX(-100%);
        transition: transform 0.45s ease;
    }

    .sidebar.open {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: #111827;
        z-index: 1000;
        padding: 24px 16px;
        box-sizing: border-box;
        transform: translateX(0);
    }

    .sidebar.open .logo {
        display: block;
        color: white;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
    }

    .sidebar.open .close-menu-btn {
        display: block;
        position: absolute;
        top: 18px;
        right: 18px;
        background: transparent;
        border: none;
        color: white;
        font-size: 26px;
        cursor: pointer;
    }

    .sidebar.open .menu-item {
        display: block;
        color: #e5e7eb;
        text-decoration: none;
        padding: 12px 14px;
        margin-bottom: 6px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .sidebar.open .menu-item:hover {
        background: #1f2937;
        color: #ffffff;
    }

    .sidebar.open .menu-item.active {
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
    }
}
/* Smooth page entrance */
body {
    animation: pageEnter 0.3s ease-out;
}

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Smooth page transition */
body {
    opacity: 1;
    transition: opacity 0.25s ease;
}

body.page-leaving {
    opacity: 0;
}
    
  </style>
</head>

<body>

<div class="top-navbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>

    <div class="top-navbar-logo">ReviewRise</div>

    <div class="top-navbar-actions">
        <button class="navbar-icon" aria-label="Account">
            ♙
        </button>
    </div>
</div>
  
  <aside class="sidebar">
    
    <button class="close-menu-btn" onclick="toggleSidebar()">×</button>
    
    <div class="logo">ReviewRise</div>

<div class="menu-item" onclick="smoothNavigate('dashboard.html')">
    Dashboard
</div>

<div class="menu-item active">
    Feedback
</div>

<div class="menu-item" onclick="smoothNavigate('analytics.html')">
    Analytics
</div>

<div class="menu-item" onclick="smoothNavigate('review-link.html')">
    Review Links
</div>

<div class="menu-item" onclick="smoothNavigate('qr-nfc.html')">
    QR & NFC
</div>

<div class="menu-item" onclick="smoothNavigate('settings.html')">
    Settings
</div>
    
  </aside>

  <main class="main">
    <h1>Customer Feedback</h1>
    <p class="subtitle">View and manage your customer feedback.</p>

    <div id="feedbackList">
      Loading feedback...
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://intlhwmvldxdiytemjlr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

async function getValidAccessToken() {
    const currentToken = localStorage.getItem("reviewrise_token");
    const refreshToken = localStorage.getItem("reviewrise_refresh_token");

    if (!refreshToken) {
        return currentToken;
    }

    try {
        const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    refresh_token: refreshToken
                })
            }
        );

        if (!response.ok) {
            return currentToken;
        }

        const data = await response.json();

        localStorage.setItem(
            "reviewrise_token",
            data.access_token
        );

        if (data.refresh_token) {
            localStorage.setItem(
                "reviewrise_refresh_token",
                data.refresh_token
            );
        }

        return data.access_token;

    } catch (error) {
        console.error("Token refresh failed:", error);
        return currentToken;
    }
}
    
    async function loadFeedback() {

      const token = await getValidAccessToken();

      if (!token) {
        window.location.href = "dashboard.html";
        return;
      }

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/Feedback?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token
          }
        }
      );

      const feedback = await response.json();

      const list = document.getElementById("feedbackList");
      list.innerHTML = "";

      feedback.forEach(item => {

        const card = document.createElement("div");
        card.className = "feedback-card";

        const stars =
          "★".repeat(item.rating) +
          "☆".repeat(5 - item.rating);

        card.innerHTML = `
          <div class="stars">${stars}</div>
          <div>${item.feedback}</div>
          <div class="date">
            ${item.business} •
            ${new Date(item.created_at).toLocaleString()}
          </div>
        `;

        list.appendChild(card);
      });
    }

    loadFeedback();

  function smoothNavigate(page) {
    document.body.classList.add("page-leaving");

    setTimeout(function () {
        window.location.href = page;
    }, 250);
}
    
    function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.classList.toggle('open');
}
    
  </script>

</body>
</html>
