<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - ReviewRise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

.sidebar {
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 28px 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 40px;
}

.menu-item {
    display: block;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 8px;
    border-radius: 9px;
    cursor: pointer;
    color: #d1d5db;
}

.menu-item:hover,
.menu-item.active {
    background: #1f2937;
    color: white;
}

    .main {
      margin-left: 240px;
      padding: 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .feedback-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .stars {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-top: 10px;
    }

    .mobile-menu-btn {
    display: none;
}
    
    @media (max-width: 800px) {

      .main {
    margin-left: 0 !important;
    width: 100% !important;
    padding: 100px 20px 30px !important;
    box-sizing: border-box;
}

#feedbackList {
    width: 100% !important;
}

.feedback-card {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box;
}
      
      .mobile-menu-btn {
    display: block;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 999;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 24px;
    cursor: pointer;
}
      
    .sidebar {
        display: none;
    }

  .sidebar.open {
    display: block;
    width: 240px;
    z-index: 1000;
}
}

.mobile-topbar {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    width: 100% !important;
    height: 76px !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
    background: #ffffff !important;
}

.mobile-topbar .topbar-menu {
    position: static !important;
    display: block !important;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    width: auto !important;
    height: auto !important;
    font-size: 30px !important;
    color: #111827 !important;
}

.mobile-topbar .topbar-logo {
    font-size: 30px !important;
    font-weight: 700 !important;
    margin: 0 !important;
}

.mobile-topbar .topbar-user {
    font-size: 27px !important;
    margin: 0 !important;
}
    
  </style>
</head>

<body>

<header class="mobile-topbar">
    <button class="topbar-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">
        ☰
    </button>

    <div class="topbar-logo">ReviewRise</div>

    <div class="topbar-user">♙</div>
</header>
  
  <aside class="sidebar">
    <div class="logo">ReviewRise</div>

    <div class="menu-item" onclick="window.location.href='dashboard.html'">
      Dashboard
    </div>

    <div class="menu-item active">
      Feedback
    </div>

<div class="menu-item" onclick="window.location.href='analytics.html'">
      Analytics
    </div>

<a href="review-link.html" class="menu-item">
    Review Links
</a>

    <div class="menu-item">
      QR & NFC
    </div>

    <div class="menu-item">
      Settings
    </div>
  </aside>

  <main class="main">
    <h1>Customer Feedback</h1>
    <p class="subtitle">View and manage your customer feedback.</p>

    <div id="feedbackList">
      Loading feedback...
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://intlhwmvldxdiytemjlr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0KjZZApJCuvTEJH3nNyLUg_aps6aXaA";

    async function loadFeedback() {

      const token = localStorage.getItem("reviewrise_token");

      if (!token) {
        window.location.href = "dashboard.html";
        return;
      }

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/Feedback?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token
          }
        }
      );

      const feedback = await response.json();

      const list = document.getElementById("feedbackList");
      list.innerHTML = "";

      feedback.forEach(item => {

        const card = document.createElement("div");
        card.className = "feedback-card";

        const stars =
          "★".repeat(item.rating) +
          "☆".repeat(5 - item.rating);

        card.innerHTML = `
          <div class="stars">${stars}</div>
          <div>${item.feedback}</div>
          <div class="date">
            ${item.business} •
            ${new Date(item.created_at).toLocaleString()}
          </div>
        `;

        list.appendChild(card);
      });
    }

    loadFeedback();
  </script>

</body>
</html>
