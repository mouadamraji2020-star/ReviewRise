<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #f3f6fb;
      color: #0c1730;
    }

    #feedbackPage {
      --side: 240px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 560px 320px at 12% -4%, rgba(186, 220, 255, 0.34), transparent 70%),
        radial-gradient(ellipse 420px 260px at 96% 8%, rgba(214, 232, 255, 0.28), transparent 72%),
        #f3f6fb;
      color: #0c1730;
    }

    #feedbackPage.sidebar-collapsed { --side: 72px; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      width: var(--side);
      height: 100vh;
      padding: 18px 12px 16px;
      background:
        linear-gradient(180deg, rgba(62, 140, 255, 0.08), transparent 22%),
        #0c1424;
      color: #d5deea;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
      padding: 0 4px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sidebar-collapse {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: #c9d4e3;
      cursor: pointer;
      transition: background 180ms cubic-bezier(0.22, 1, 0.36, 1), color 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar-collapse svg,
    .menu-item svg,
    .account-avatar svg,
    .account-chevron {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-collapse svg {
      width: 16px;
      height: 16px;
      transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar-collapse:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }

    #feedbackPage.sidebar-collapsed .sidebar-top { flex-direction: column; gap: 12px; }
    #feedbackPage.sidebar-collapsed .sidebar-collapse svg { transform: rotate(180deg); }

    .dash-logo-mark {
      width: 34px;
      height: 26px;
      position: relative;
      overflow: hidden;
      flex: none;
    }

    .dash-logo-mark img {
      position: absolute;
      left: 0;
      top: 0;
      width: 82px;
      height: 82px;
      max-width: none;
      transform: translate(-23px, -14px);
    }

    .dash-logo-name {
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      max-width: 140px;
    }

    .dash-logo-name span {
      background: linear-gradient(90deg, #7eb6ff 10%, #3ec6ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .dash-logo-name,
    .menu-label {
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), max-width 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .menu-label { max-width: 150px; }

    #feedbackPage.sidebar-collapsed .dash-logo-name,
    #feedbackPage.sidebar-collapsed .menu-label {
      max-width: 0;
      opacity: 0;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 28px;
    }

    .menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      color: #c5d0de;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      transition: background 180ms cubic-bezier(0.22, 1, 0.36, 1), color 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .menu-item svg { width: 18px; height: 18px; flex: none; }

    .menu-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

    .menu-item.active {
      background: linear-gradient(90deg, rgba(43, 127, 255, 0.22), rgba(16, 36, 68, 0.55));
      color: #f5f8ff;
      box-shadow: inset 2px 0 0 #67b7ff, inset 0 0 0 1px rgba(120, 176, 255, 0.22);
    }

    .menu-item.active svg { color: #8ec5ff; }

    #feedbackPage.sidebar-collapsed .menu-item { justify-content: center; gap: 0; padding: 10px 0; }

    #feedbackPage.sidebar-collapsed .menu-item::after {
      content: attr(data-label);
      position: absolute;
      left: calc(100% + 12px);
      top: 50%;
      z-index: 5;
      padding: 6px 8px;
      border-radius: 8px;
      background: #0c1424;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(8, 16, 32, 0.2);
      transform: translateY(-50%);
      transition: opacity 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #feedbackPage.sidebar-collapsed .menu-item:hover::after { opacity: 1; }

    .close-menu-btn { display: none; }

    .app-workspace {
      min-height: 100vh;
      min-width: 0;
      transition: margin-left 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.78);
      border-bottom: 1px solid rgba(226, 232, 240, 0.95);
      backdrop-filter: blur(16px);
    }

    .top-navbar-title { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .top-navbar-title h1 {
      margin: 0;
      color: #0c1730;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.45px;
      line-height: 1.15;
    }

    .top-navbar-title p {
      margin: 2px 0 0;
      color: #7b8ba0;
      font-size: 12.5px;
      font-weight: 500;
    }

    .top-navbar-actions { position: relative; margin-left: auto; display: flex; align-items: center; }

    .navbar-icon {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border: 1px solid #e7ecf2;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #10284d;
      cursor: pointer;
      transition: border-color 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .navbar-icon:hover { border-color: #b9d4ff; box-shadow: 0 6px 16px rgba(43, 127, 255, 0.12); }

    .account-avatar {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(180deg, #f7faff, #e7f1ff);
      color: #1d4ed8;
    }

    .account-avatar svg { width: 16px; height: 16px; }
    .account-chevron { width: 14px; height: 14px; color: #8b97a8; }

    .account-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 160px;
      padding: 6px;
      background: #fff;
      border: 1px solid #e7ecf2;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(16, 40, 80, 0.08);
      z-index: 40;
    }

    .account-menu.open { display: block; }

    .account-menu button {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #10284d;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 160ms cubic-bezier(0.22, 1, 0.36, 1), color 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .account-menu button:hover { background: #f3f7fd; color: #1d4ed8; }

    .mobile-menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid #e7ecf2;
      border-radius: 10px;
      background: #fff;
      color: #10284d;
      font-size: 20px;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
    }

    .main { margin: 0; padding: 26px 28px 36px; }

    .page-intro { position: relative; padding: 2px 0 0; }

    .page-intro::before {
      content: "";
      position: absolute;
      left: -24px;
      top: -28px;
      width: 280px;
      height: 120px;
      background: radial-gradient(circle, rgba(186, 220, 255, 0.42), transparent 70%);
      pointer-events: none;
    }

    .page-intro h2,
    .page-intro p { position: relative; }

    .page-intro h2 {
      margin: 0;
      color: #0c1730;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.7px;
      line-height: 1.15;
    }

    .page-intro p {
      margin: 6px 0 0;
      color: #6d7c92;
      font-size: 14.5px;
      font-weight: 500;
    }

    .feedback-panel {
      margin-top: 22px;
      padding: 20px;
      background: #fff;
      border: 1px solid #e7ecf2;
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(30, 64, 120, 0.045);
    }

    #feedbackList {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feedback-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 196px;
      column-gap: 20px;
      align-items: center;
      margin: 0;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #e7edf4;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(16, 40, 80, 0.04);
      transition:
        background 180ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 180ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .feedback-card:hover {
      background: #f8fbff;
      border-color: #d3e3f6;
      box-shadow: 0 8px 18px rgba(30, 64, 120, 0.06);
      transform: translateY(-1px);
    }

    .feedback-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sentiment {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .sentiment svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sentiment .face-eye { fill: currentColor; stroke: none; }

    .sentiment-5 { color: #1c9a52; background: #e8f7ee; }
    .sentiment-4 { color: #149a8c; background: #e7f6f3; }
    .sentiment-3 { color: #d09a12; background: #fbf6e6; }
    .sentiment-2 { color: #e07a28; background: #fdf1e7; }
    .sentiment-1 { color: #d64545; background: #fdeeee; }

    .feedback-rating {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .stars { margin: 0; font-size: 12px; letter-spacing: 1px; line-height: 1; }
    .star-on { color: #e2b100; }
    .star-off { color: #e3e8ef; }

    .rating-num {
      color: #7b8ba0;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      font-variant-numeric: tabular-nums;
    }

    .feedback-text {
      margin: 0;
      color: #0c1730;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: -0.15px;
      overflow-wrap: anywhere;
    }

    .feedback-text.is-empty {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      font-style: italic;
    }

    .feedback-meta {
      min-width: 0;
      padding-left: 18px;
      border-left: 1px solid #eef2f6;
      text-align: right;
    }

    .feedback-business {
      color: #10284d;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.15px;
      line-height: 1.35;
    }

    .date {
      margin: 4px 0 0;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .feedback-empty { padding: 36px 12px 28px; text-align: center; }
    .feedback-empty strong { display: block; color: #0c1730; font-size: 15px; }
    .feedback-empty p { margin: 6px auto 0; max-width: 360px; color: #6d7c92; font-size: 13.5px; line-height: 1.5; }

    .dash-loading { margin: 28px 8px; color: #8b97a8; font-size: 13.5px; }

    @media (min-width: 801px) {
      .app-workspace { margin-left: var(--side); }
      #mobileMenuBtn { display: none !important; }
      .sidebar { display: flex !important; transform: none; }

      .top-navbar,
      .main {
        padding-left: 28px;
        padding-right: clamp(28px, calc(100% - 1428px), 2000px);
        transition:
          padding-left 280ms cubic-bezier(0.22, 1, 0.36, 1),
          padding-right 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #feedbackPage.sidebar-collapsed .top-navbar,
      #feedbackPage.sidebar-collapsed .main {
        padding-left: clamp(28px, calc((100% - 1400px) / 2), 2000px);
        padding-right: clamp(28px, calc((100% - 1400px) / 2), 2000px);
      }
    }

    @media (max-width: 800px) {
      .close-menu-btn {
        display: none;
        position: absolute;
        top: 14px;
        right: 12px;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
      }

      .sidebar { display: none; width: 240px; }
      .sidebar.open { display: flex; width: 240px; padding-top: 22px; }
      .sidebar.open .close-menu-btn { display: block; }
      .sidebar-collapse { display: none; }
      .mobile-menu-btn { display: flex; }
      .app-workspace { margin-left: 0; }
      .top-navbar { padding: 14px 16px; }
      .top-navbar-title p { display: none; }
      .main { padding: 20px 16px 32px; }
      .page-intro h2 { font-size: 24px; }
      .feedback-card {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
        transform: none;
      }
      .feedback-card:hover { transform: none; }
      .feedback-side { flex-direction: row; justify-content: flex-start; gap: 12px; }
      .feedback-rating { flex-direction: row; align-items: center; gap: 8px; }
      .feedback-meta {
        padding-left: 0;
        padding-top: 12px;
        border-left: none;
        border-top: 1px solid #eef2f6;
        text-align: left;
      }

      #feedbackPage.sidebar-collapsed .sidebar { width: 240px; }
      #feedbackPage.sidebar-collapsed .sidebar-top { flex-direction: row; }
      #feedbackPage.sidebar-collapsed .dash-logo-name,
      #feedbackPage.sidebar-collapsed .menu-label { max-width: 150px; opacity: 1; }
      #feedbackPage.sidebar-collapsed .menu-item { justify-content: flex-start; gap: 10px; padding: 9px 12px; }
      #feedbackPage.sidebar-collapsed .menu-item::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar,
      .app-workspace,
      .top-navbar,
      .main,
      .dash-logo-name,
      .menu-label,
      .sidebar-collapse svg,
      .menu-item,
      .menu-item::after,
      .navbar-icon,
      .account-menu button,
      .feedback-card { transition: none; }
      .feedback-card:hover { transform: none; }
    }

    body { opacity: 1; transition: opacity 0.25s ease; }
    body.page-leaving { opacity: 0; }
  </style>
</head>

    try {
        const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    refresh_token: refreshToken
                })
            }
        );

        if (!response.ok) {
            return currentToken;
        }

        const data = await response.json();

        localStorage.setItem(
            "reviewrise_token",
            data.access_token
        );

        if (data.refresh_token) {
            localStorage.setItem(
                "reviewrise_refresh_token",
                data.refresh_token
            );
        }

        return data.access_token;

    } catch (error) {
        console.error("Token refresh failed:", error);
        return currentToken;
    }
}
    const FEEDBACK_DATA_CACHE_KEY = "reviewrise_feedback_data_cache";

    function readFeedbackDataCache() {
      const cached = localStorage.getItem(FEEDBACK_DATA_CACHE_KEY);

      if (!cached) return null;

      try {
        const data = JSON.parse(cached);
        return Array.isArray(data) ? data : null;
      } catch (error) {
        console.error("Feedback data cache error:", error);
        return null;
      }
    }

    function saveFeedbackDataCache(rows) {
      localStorage.setItem(
        FEEDBACK_DATA_CACHE_KEY,
        JSON.stringify(rows)
      );
    }

    function renderFeedbackList(feedback) {
      const list = document.getElementById("feedbackList");
      list.innerHTML = "";

      if (!feedback.length) {
        list.innerHTML = '<div class="feedback-empty"><strong>No feedback yet</strong><p>Once customers leave private feedback, it will appear here.</p></div>';
        return;
      }

      feedback.forEach(item => {
        const card = document.createElement("div");
        card.className = "feedback-card";

        const rating = Number(item.rating) || 0;
        const filled = Math.max(0, Math.min(5, Math.floor(rating)));
        const moods = {
          5: ["sentiment-5", "M8 13.2c1.15 2.5 6.85 2.5 8 0"],
          4: ["sentiment-4", "M8.5 13.7c.95 1.7 6.05 1.7 7 0"],
          3: ["sentiment-3", "M8.6 14.4h6.8"],
          2: ["sentiment-2", "M8.5 15.6c.95-1.6 6.05-1.6 7 0"],
          1: ["sentiment-1", "M8 16.2c1.15-2.5 6.85-2.5 8 0"]
        };
        const mood = moods[filled];
        const face = mood
          ? '<div class="sentiment ' + mood[0] + '" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle class="face-eye" cx="9" cy="10" r="0.9"/><circle class="face-eye" cx="15" cy="10" r="0.9"/><path d="' + mood[1] + '"/></svg></div>'
          : "";
        const when = new Date(item.created_at);
        const whenLabel = isNaN(when.getTime())
          ? ""
          : when.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
            " · " +
            when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

        var comment = item.feedback && String(item.feedback).trim();

        card.innerHTML = `
          <div class="feedback-side">
            ${face}
            <div class="feedback-rating">
              <div class="stars"><span class="star-on">${"★".repeat(filled)}</span><span class="star-off">${"★".repeat(Math.max(0, 5 - filled))}</span></div>
              ${rating ? '<span class="rating-num">' + rating.toFixed(1) + "</span>" : ""}
            </div>
          </div>
          <div class="feedback-text${comment ? "" : " is-empty"}">${comment ? item.feedback : "No written comment"}</div>
          <div class="feedback-meta">
            <div class="feedback-business">${item.business || ""}</div>
            <div class="date">${whenLabel}</div>
          </div>
        `;

        list.appendChild(card);
      });
    }

    async function loadFeedback() {
      const token = await getValidAccessToken();

      if (!token) {
        window.location.href = "dashboard.html";
        return;
      }

      let response;

      try {
        response = await fetch(
          SUPABASE_URL + "/rest/v1/Feedback?select=*&order=created_at.desc",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + token
            }
          }
        );
      } catch (error) {
        console.error("Feedback load error:", error);
        return;
      }

      if (response.status === 401 || response.status === 403) {
        window.location.href = "dashboard.html";
        return;
      }

      if (!response.ok) {
        return;
      }

      const feedback = await response.json();

      if (!Array.isArray(feedback)) {
        return;
      }

      saveFeedbackDataCache(feedback);
      renderFeedbackList(feedback);
    }

    if (
      !localStorage.getItem("reviewrise_token") &&
      !localStorage.getItem("reviewrise_refresh_token")
    ) {
      window.location.href = "dashboard.html";
    } else {
      const cachedFeedback = readFeedbackDataCache();

      if (cachedFeedback) {
        renderFeedbackList(cachedFeedback);
      }

      loadFeedback();
    }

  function smoothNavigate(page) {
    document.body.classList.add("page-leaving");

    setTimeout(function () {
        window.location.href = page;
    }, 250);
}

    function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const menuButton = document.getElementById("mobileMenuBtn");

    if (window.innerWidth <= 800) {
        sidebar.classList.toggle('open');

        if (menuButton) {
            menuButton.style.display = sidebar.classList.contains('open') ? "none" : "block";
        }

        return;
    }

    sidebar.classList.toggle('open');
}

    function toggleAccountMenu() {
      const accountMenu = document.getElementById("accountMenu");
      accountMenu.classList.toggle("open");
    }

    function logout() {
      localStorage.removeItem("reviewrise_token");
      localStorage.removeItem("reviewrise_refresh_token");
      localStorage.removeItem("reviewrise_dashboard_cache");
      localStorage.removeItem("reviewrise_feedback_cache");
      localStorage.removeItem("reviewrise_analytics_cache");
      localStorage.removeItem("reviewrise_reviewlinks_data");
      localStorage.removeItem(FEEDBACK_DATA_CACHE_KEY);
      window.location.href = "dashboard.html";
    }

    (function initSidebarCollapse() {
      var button = document.getElementById("sidebarCollapse");
      var page = document.getElementById("feedbackPage");

      if (!button || !page) {
        return;
      }

      function applyCollapsed(collapsed) {
        if (window.innerWidth <= 800) {
          return;
        }

        page.classList.toggle("sidebar-collapsed", collapsed);
        button.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
      }

      button.addEventListener("click", function () {
        if (window.innerWidth <= 800) {
          return;
        }

        var collapsed = !page.classList.contains("sidebar-collapsed");
        applyCollapsed(collapsed);
        localStorage.setItem("reviewrise_sidebar_collapsed", collapsed ? "1" : "0");
      });

      var stored = localStorage.getItem("reviewrise_sidebar_collapsed");
      var collapsed = stored === "1" || (stored !== "0" && window.innerWidth <= 1100);
      applyCollapsed(collapsed);
    })();

  </script>
